name: Build Test
on: [push]

jobs:
  build:
    name: Build with Java 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      - run: java -version
      - run: mvn --version
      - run: mvn -B package
